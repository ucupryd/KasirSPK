<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasir Kantin</title>
  <style>
    :root {
      --text: #2C2C2B;
      --text2: #7D7A75;
      --canvas: #FFFFFF;
      --soft: #F9F8F7;
      --surface2: #F0EFED;
      --border: #E6E5E3;
      --blue: #2783DE;
      --blue-soft: #E5F2FC;
      --green: #46A171;
      --green-soft: #E8F1EC;
      --orange: #D5803B;
      --orange-soft: #FBEBDE;
      --red: #E56458;
      --red-soft: #FCE9E7;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 12px rgba(0, 0, 0, .04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--soft);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input,
    select {
      font-family: inherit;
      font-size: 16px;
    }

    /* ---------- Top bar ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--canvas);
      border-bottom: 1px solid var(--border);
    }

    .bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }

    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .badge {
      margin-left: auto;
      font-size: 13px;
      padding: 5px 11px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      color: var(--text2);
      background: var(--soft);
      white-space: nowrap;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
    }

    .badge.live .dot {
      background: var(--green);
    }

    nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }

    nav button {
      border: none;
      background: none;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      font-weight: 500;
    }

    nav button.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    nav button:hover {
      color: var(--text);
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    h2.title {
      font-size: 22px;
      margin: 0 0 4px;
    }

    p.sub {
      color: var(--text2);
      margin: 0 0 20px;
      font-size: 14px;
    }

    /* ---------- Kasir layout ---------- */
    .kasir {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }

    .searchbox {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--canvas);
      margin-bottom: 16px;
      outline: none;
    }

    .searchbox:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .menu-card {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: left;
      transition: .12s;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-card:hover {
      border-color: var(--blue);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .menu-card .nm {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.3;
    }

    .menu-card .pr {
      color: var(--blue);
      font-weight: 700;
      font-size: 14px;
      margin-top: 8px;
    }

    /* ---------- Cart ---------- */
    .cart {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      position: sticky;
      top: 120px;
    }

    .cart h3 {
      margin: 0 0 14px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart .count {
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .cart-empty {
      color: var(--text2);
      text-align: center;
      padding: 28px 0;
      font-size: 14px;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 38vh;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .ci {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ci .cinm {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
    }

    .ci .cinm small {
      display: block;
      color: var(--text2);
      font-weight: 400;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper button {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--soft);
      font-size: 16px;
      line-height: 1;
      color: var(--text);
    }

    .stepper button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .stepper span {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .total-row .lbl {
      color: var(--text2);
      font-size: 14px;
    }

    .total-row .amt {
      font-size: 22px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    .pay-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .pay-toggle button {
      padding: 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--canvas);
      font-weight: 600;
      font-size: 14px;
      color: var(--text2);
    }

    .pay-toggle button.on-lunas {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .pay-toggle button.on-belum {
      background: var(--orange-soft);
      border-color: var(--orange);
      color: var(--orange);
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
    }

    .btn-primary:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-ghost {
      width: 100%;
      padding: 9px;
      border: none;
      background: none;
      color: var(--text2);
      font-size: 13px;
      margin-top: 8px;
    }

    .btn-ghost:hover {
      color: var(--red);
    }

    /* ---------- Cards / dashboard ---------- */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--canvas);
      font-size: 14px;
      color: var(--text2);
    }

    .chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .stat .k {
      font-size: 13px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .stat .v {
      font-size: 28px;
      font-weight: 800;
      margin-top: 8px;
    }

    .stat .v.green {
      color: var(--green);
    }

    .stat .v.orange {
      color: var(--orange);
    }

    .ico {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 13px;
    }

    .ico.b {
      background: var(--blue-soft);
    }

    .ico.g {
      background: var(--green-soft);
    }

    .ico.o {
      background: var(--orange-soft);
    }

    .ico.p {
      background: var(--surface2);
    }

    .panel {
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel h3 {
      margin: 0;
      padding: 16px 18px;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px 18px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text2);
      font-weight: 600;
      background: var(--soft);
    }

    tr:last-child td {
      border-bottom: none;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .tag {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .tag.lunas {
      background: var(--green-soft);
      color: var(--green);
    }

    .tag.belum {
      background: var(--orange-soft);
      color: var(--orange);
    }

    .btn-sm {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--green);
      background: var(--green-soft);
      color: var(--green);
      font-weight: 600;
      font-size: 13px;
    }

    .btn-sm:hover {
      background: var(--green);
      color: #fff;
    }

    .empty {
      padding: 40px 18px;
      text-align: center;
      color: var(--text2);
      font-size: 14px;
    }

    .tablewrap {
      overflow-x: auto;
    }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.err {
      background: var(--red);
    }

    @media (max-width:820px) {
      .kasir {
        grid-template-columns: 1fr;
      }

      .cart {
        position: static;
      }

      .bar {
        padding: 12px 16px;
      }

      main {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <div class="brand"><span class="logo">🧾</span><span id="brandName">Kasir Kantin</span></div>
      <div class="badge" id="connBadge"><span class="dot"></span><span id="connText">Mode Demo</span></div>
    </div>
    <nav>
      <button data-view="kasir" class="active">🛒 Kasir</button>
      <button data-view="pemasukan">💰 Pemasukan</button>
      <button data-view="histori">📜 Histori Pesanan</button>
      <button data-view="belum">⏳ Belum Bayar</button>
    </nav>
  </header>

  <main>
    <!-- ===== KASIR ===== -->
    <section class="view active" id="view-kasir">
      <div class="kasir">
        <div>
          <input class="searchbox" id="menuSearch" placeholder="🔍 Cari menu..." />
          <div class="menu-grid" id="menuGrid"></div>
        </div>
        <aside class="cart">
          <h3>Pesanan <span class="count" id="cartCount">0</span></h3>
          <div id="cartBody"></div>
        </aside>
      </div>
    </section>

    <!-- ===== PEMASUKAN ===== -->
    <section class="view" id="view-pemasukan">
      <h2 class="title">Pemasukan</h2>
      <p class="sub">Ringkasan penjualan kantin.</p>
      <div class="toolbar" id="pemFilter">
        <button class="chip active" data-range="today">Hari Ini</button>
        <button class="chip" data-range="all">Semua</button>
      </div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="panel">
        <h3>Produk Terlaris</h3>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Menu</th>
                <th class="num">Terjual</th>
                <th class="num">Subtotal</th>
              </tr>
            </thead>
            <tbody id="topBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ===== HISTORI ===== -->
    <section class="view" id="view-histori">
      <h2 class="title">Histori Pesanan</h2>
      <p class="sub">Semua transaksi yang tercatat.</p>
      <input class="searchbox" id="histSearch" placeholder="🔍 Cari pelanggan atau menu..." />
      <div class="panel">
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Pelanggan</th>
                <th>Detail</th>
                <th class="num">Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="histBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ===== BELUM BAYAR ===== -->
    <section class="view" id="view-belum">
      <h2 class="title">Belum Bayar</h2>
      <p class="sub">Pesanan yang masih menunggu pembayaran.</p>
      <div class="panel">
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Pelanggan</th>
                <th>Detail</th>
                <th class="num">Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="belumBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    /* ================================================================
       KONFIGURASI — isi API_URL dengan URL Web App Apps Script kamu.
       Biarkan kosong ("") untuk mencoba dalam Mode Demo (data lokal).
       ================================================================ */
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbzinsDZr9ija9EQaCoyz-r41QpuPyjNW7bVp8-nwuib_UeEdVUv0hJvi_Hbv4bjMs1N/exec",                 // <-- tempel URL /exec di sini
      STORE_NAME: "Kasir Kantin",  // nama yang tampil di header
    };

    /* ---------------- State ---------------- */
    const DEMO = !CONFIG.API_URL;
    let MENU = [];
    let ORDERS = [];
    let cart = {};           // { nama: {nama, harga, qty} }
    let payStatus = "Lunas";
    let pemRange = "today";

    const MENU_SEED = [
      { nama: "Sarimi Gelas", harga: 3000 }, { nama: "Teajus", harga: 2000 }, { nama: "Jasjus", harga: 1000 },
      { nama: "Nutrisari", harga: 3000 }, { nama: "Susu putih", harga: 5000 }, { nama: "Susu coklat", harga: 5000 },
      { nama: "Good day", harga: 5000 }, { nama: "Top coffee", harga: 5000 }, { nama: "Bengbeng", harga: 5000 },
      { nama: "yupi love", harga: 1000 }, { nama: "basreng", harga: 500 }, { nama: "makaroni", harga: 2000 },
      { nama: "taro", harga: 1000 }, { nama: "suki", harga: 1000 }, { nama: "garuda rosta", harga: 1000 },
      { nama: "golden chips", harga: 1000 }, { nama: "riry", harga: 500 }, { nama: "yupi gummy", harga: 500 },
      { nama: "air es", harga: 1000 },
    ];

    /* ---------------- Utils ---------------- */
    const rp = n => "Rp\u00a0" + (Number(n) || 0).toLocaleString("id-ID");
    const $ = s => document.querySelector(s);
    function toast(msg, isErr) { const t = $("#toast"); t.textContent = msg; t.className = "show" + (isErr ? " err" : ""); setTimeout(() => t.className = "", 2200); }
    function isToday(iso) { const d = new Date(iso), n = new Date(); return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate(); }
    function fmtTime(iso) { const d = new Date(iso); return d.toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); }

    /* ---------------- Data layer (Demo <-> Live) ---------------- */
    async function apiGet(action) {
      const r = await fetch(CONFIG.API_URL + "?action=" + action);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "Gagal");
      return j.data;
    }
    async function apiPost(payload) {
      const r = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "Gagal");
      return j.data;
    }
    function lsOrders() { try { return JSON.parse(localStorage.getItem("kasir_orders") || "[]"); } catch (e) { return []; } }
    function lsSave(o) { localStorage.setItem("kasir_orders", JSON.stringify(o)); }

    async function loadMenu() {
      if (DEMO) { MENU = MENU_SEED.slice(); return; }
      MENU = await apiGet("getMenu");
    }
    async function loadOrders() {
      if (DEMO) { ORDERS = lsOrders(); return; }
      ORDERS = await apiGet("getOrders");
    }
    async function saveOrder(order) {
      if (DEMO) {
        const o = lsOrders();
        o.push({ ...order, id: "TRX" + Date.now(), waktu: new Date().toISOString() });
        lsSave(o); return;
      }
      await apiPost({ action: "addOrder", pelanggan: order.pelanggan, status: order.status, items: order.items });
    }
    async function setPaid(id) {
      if (DEMO) { const o = lsOrders().map(x => x.id === id ? { ...x, status: "Lunas" } : x); lsSave(o); return; }
      await apiPost({ action: "markPaid", id: id });
    }

    /* ---------------- Render: Menu ---------------- */
    function renderMenu() {
      const q = ($("#menuSearch").value || "").toLowerCase();
      const grid = $("#menuGrid"); grid.innerHTML = "";
      const list = MENU.filter(m => m.nama.toLowerCase().includes(q));
      if (!list.length) { grid.innerHTML = '<div class="empty">Menu tidak ditemukan.</div>'; return; }
      list.forEach(m => {
        const b = document.createElement("button"); b.className = "menu-card";
        b.innerHTML = '<span class="nm">' + m.nama + '</span><span class="pr">' + rp(m.harga) + '</span>';
        b.onclick = () => addToCart(m);
        grid.appendChild(b);
      });
    }

    /* ---------------- Cart ---------------- */
    function addToCart(m) {
      if (!cart[m.nama]) cart[m.nama] = { nama: m.nama, harga: m.harga, qty: 0 };
      cart[m.nama].qty++; renderCart();
    }
    function changeQty(nama, d) {
      if (!cart[nama]) return; cart[nama].qty += d;
      if (cart[nama].qty <= 0) delete cart[nama];
      renderCart();
    }
    function cartItems() { return Object.values(cart); }
    function cartTotal() { return cartItems().reduce((s, i) => s + i.harga * i.qty, 0); }
    function renderCart() {
      const items = cartItems();
      $("#cartCount").textContent = items.reduce((s, i) => s + i.qty, 0);
      const body = $("#cartBody");
      if (!items.length) {
        body.innerHTML = '<div class="cart-empty">Belum ada item.<br>Klik menu untuk menambah.</div>';
        return;
      }
      let h = '<div class="cart-list">';
      items.forEach(i => {
        h += '<div class="ci"><div class="cinm">' + i.nama + '<small>' + rp(i.harga) + '</small></div>' +
          '<div class="stepper"><button data-m="' + i.nama + '" data-d="-1">−</button>' +
          '<span>' + i.qty + '</span><button data-m="' + i.nama + '" data-d="1">+</button></div></div>';
      });
      h += '</div>';
      h += '<div class="total-row"><span class="lbl">Total</span><span class="amt">' + rp(cartTotal()) + '</span></div>';
      h += '<div class="field"><label>Nama pelanggan (opsional)</label><input id="custName" placeholder="cth: Meja 3 / Andi"/></div>';
      h += '<div class="pay-toggle" id="payToggle">' +
        '<button data-s="Lunas" class="' + (payStatus === "Lunas" ? "on-lunas" : "") + '">✅ Lunas</button>' +
        '<button data-s="Belum Bayar" class="' + (payStatus === "Belum Bayar" ? "on-belum" : "") + '">⏳ Belum Bayar</button></div>';
      h += '<button class="btn-primary" id="saveBtn">Simpan Pesanan · ' + rp(cartTotal()) + '</button>';
      h += '<button class="btn-ghost" id="clearBtn">Kosongkan</button>';
      body.innerHTML = h;

      body.querySelectorAll(".stepper button").forEach(b => b.onclick = () => changeQty(b.dataset.m, Number(b.dataset.d)));
      body.querySelectorAll("#payToggle button").forEach(b => b.onclick = () => { payStatus = b.dataset.s; renderCart(); });
      $("#saveBtn").onclick = submitOrder;
      $("#clearBtn").onclick = () => { cart = {}; renderCart(); };
    }

    async function submitOrder() {
      const items = cartItems();
      if (!items.length) return;
      const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Menyimpan...";
      const pelanggan = ($("#custName") ? $("#custName").value : "").trim();
      try {
        await saveOrder({ pelanggan, status: payStatus, items: items.map(i => ({ nama: i.nama, harga: i.harga, qty: i.qty })) });
        cart = {}; payStatus = "Lunas"; renderCart();
        await loadOrders(); refreshAll();
        toast("Pesanan tersimpan ✓");
      } catch (e) { toast("Gagal: " + e.message, true); btn.disabled = false; }
    }

    /* ---------------- Pemasukan ---------------- */
    function filteredOrders() { return pemRange === "today" ? ORDERS.filter(o => isToday(o.waktu)) : ORDERS.slice(); }
    function renderPemasukan() {
      const list = filteredOrders();
      const lunas = list.filter(o => o.status === "Lunas");
      const belum = list.filter(o => o.status !== "Lunas");
      const totalLunas = lunas.reduce((s, o) => s + o.total, 0);
      const totalBelum = belum.reduce((s, o) => s + o.total, 0);
      const itemQty = list.reduce((s, o) => s + (o.items || []).reduce((a, i) => a + i.qty, 0), 0);
      $("#statGrid").innerHTML =
        stat("Pemasukan (Lunas)", rp(totalLunas), "green", "g", "💰") +
        stat("Belum Dibayar", rp(totalBelum), "orange", "o", "⏳") +
        stat("Jumlah Pesanan", list.length, "", "b", "🧾") +
        stat("Item Terjual", itemQty, "", "p", "📦");
      // top products
      const map = {};
      list.forEach(o => (o.items || []).forEach(i => { if (!map[i.nama]) map[i.nama] = { qty: 0, sub: 0 }; map[i.nama].qty += i.qty; map[i.nama].sub += i.harga * i.qty; }));
      const top = Object.entries(map).sort((a, b) => b[1].qty - a[1].qty).slice(0, 8);
      const tb = $("#topBody");
      tb.innerHTML = top.length ? top.map(([n, v]) => '<tr><td>' + n + '</td><td class="num">' + v.qty + '</td><td class="num">' + rp(v.sub) + '</td></tr>').join("")
        : '<tr><td colspan="3" class="empty">Belum ada data.</td></tr>';
    }
    function stat(k, v, cls, ico, em) { return '<div class="stat"><div class="k"><span class="ico ' + ico + '">' + em + '</span>' + k + '</div><div class="v ' + cls + '">' + v + '</div></div>'; }

    /* ---------------- Histori ---------------- */
    function renderHistori() {
      const q = ($("#histSearch").value || "").toLowerCase();
      const list = ORDERS.slice().sort((a, b) => new Date(b.waktu) - new Date(a.waktu))
        .filter(o => (o.pelanggan + " " + o.detail).toLowerCase().includes(q));
      const tb = $("#histBody");
      if (!list.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">Belum ada pesanan.</td></tr>'; return; }
      tb.innerHTML = list.map(o => '<tr><td>' + fmtTime(o.waktu) + '</td><td>' + (o.pelanggan || "-") + '</td><td>' + o.detail +
        '</td><td class="num">' + rp(o.total) + '</td><td>' + tag(o.status) + '</td></tr>').join("");
    }
    function tag(s) { return s === "Lunas" ? '<span class="tag lunas">Lunas</span>' : '<span class="tag belum">Belum Bayar</span>'; }

    /* ---------------- Belum Bayar ---------------- */
    function renderBelum() {
      const list = ORDERS.filter(o => o.status !== "Lunas").sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
      const tb = $("#belumBody");
      if (!list.length) { tb.innerHTML = '<tr><td colspan="5" class="empty">🎉 Tidak ada tagihan tertunda.</td></tr>'; return; }
      tb.innerHTML = list.map(o => '<tr><td>' + fmtTime(o.waktu) + '</td><td>' + (o.pelanggan || "-") + '</td><td>' + o.detail +
        '</td><td class="num">' + rp(o.total) + '</td><td><button class="btn-sm" data-id="' + o.id + '">Tandai Lunas</button></td></tr>').join("");
      tb.querySelectorAll(".btn-sm").forEach(b => b.onclick = async () => {
        b.disabled = true; b.textContent = "...";
        try { await setPaid(b.dataset.id); await loadOrders(); refreshAll(); toast("Ditandai lunas ✓"); }
        catch (e) { toast("Gagal: " + e.message, true); }
      });
    }

    /* ---------------- Refresh & nav ---------------- */
    function refreshAll() { renderPemasukan(); renderHistori(); renderBelum(); }
    function switchView(v) {
      document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
      document.querySelectorAll(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + v));
    }

    /* ---------------- Init ---------------- */
    async function init() {
      $("#brandName").textContent = CONFIG.STORE_NAME;
      if (!DEMO) { $("#connBadge").classList.add("live"); $("#connText").textContent = "Terhubung ke Sheet"; }
      document.querySelectorAll("nav button").forEach(b => b.onclick = () => switchView(b.dataset.view));
      $("#menuSearch").oninput = renderMenu;
      $("#histSearch").oninput = renderHistori;
      document.querySelectorAll("#pemFilter .chip").forEach(c => c.onclick = () => {
        pemRange = c.dataset.range;
        document.querySelectorAll("#pemFilter .chip").forEach(x => x.classList.toggle("active", x === c));
        renderPemasukan();
      });
      try {
        await loadMenu(); await loadOrders();
      } catch (e) { toast("Gagal memuat data: " + e.message, true); }
      renderMenu(); renderCart(); refreshAll();
    }
    init();
  </script>
</body>

</html>
